<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASP observer</title>
<style>
  :root { --bg:#fafaf8; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2e1dc; --ok:#1f7a4d; --warn:#b86a00; --bad:#b3261e; --info:#2b5fb3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe6; --muted:#9a9993; --line:#2e2e2b; --ok:#5cc28d; --warn:#e3a441; --bad:#ef7a72; --info:#7aa6ef; } }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; }
  h1 { font-size:18px; margin:0; }
  #conn { color:var(--muted); font-size:13px; }
  .status { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; justify-content:flex-end; }
  #auth { display:flex; gap:6px; }
  #auth[hidden], #forget[hidden] { display:none; }
  #auth input, #auth button, #forget { font:inherit; font-size:13px; padding:3px 8px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); }
  #auth input { width:220px; }
  #auth button, #forget { cursor:pointer; }
  main { display:grid; grid-template-columns: minmax(0,3fr) minmax(0,2fr); gap:24px; padding:24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--muted); font-size:12px; }
  .id { color:var(--muted); font-size:11px; font-family:ui-monospace, monospace; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; border:1px solid currentColor; margin:1px 2px 1px 0; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .info { color:var(--info); } .muted { color:var(--muted); }
  #log { list-style:none; margin:0; padding:0; font-size:13px; }
  #log li { padding:6px 0; border-bottom:1px solid var(--line); }
  #log time { color:var(--muted); font-family:ui-monospace, monospace; margin-right:8px; }
  h2 { font-size:14px; margin:0 0 8px; }
</style>
</head>
<body>
<header>
  <h1>ASP observer <span class="muted">(illustrative)</span></h1>
  <div class="status">
    <form id="auth" hidden>
      <input id="tok" type="password" placeholder="ASP token" aria-label="ASP token" autocomplete="off" required>
      <button type="submit">Connect</button>
    </form>
    <span id="conn">connecting…</span>
    <button id="forget" type="button" hidden>Forget token</button>
  </div>
</header>
<main>
  <section>
    <h2>Agents</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Agent</th><th>Lifecycle</th><th>Health</th><th>Governance</th><th>Tasks</th><th>Floor</th><th>Last event</th></tr></thead>
        <tbody id="agents"></tbody>
      </table>
    </div>
  </section>
  <section>
    <h2>Event stream <span class="muted">newest first</span></h2>
    <ul id="log"></ul>
  </section>
</main>
<script>
// The token is sent in the Authorization header and kept only for this browser tab.
// A token passed as ?token= is accepted once and then removed from the address bar.
const TOKEN_KEY = "asp-token";
const store = {
  get() { try { return sessionStorage.getItem(TOKEN_KEY); } catch (err) { return null; } },
  set(value) { try { value ? sessionStorage.setItem(TOKEN_KEY, value) : sessionStorage.removeItem(TOKEN_KEY); } catch (err) { /* memory only */ } },
};
const params = new URLSearchParams(location.search);
let token = params.get("token") || store.get();
if (params.has("token")) {
  store.set(token);
  params.delete("token");
  history.replaceState(null, "", location.pathname + (params.toString() ? "?" + params : "") + location.hash);
}
const authHeaders = () => (token ? { Authorization: "Bearer " + token } : {});
const el = id => document.getElementById(id);
let agents = {};
let waitingForToken = false;
let controller = null;
let lastEventId = "0";

const classFor = (dim, value) => {
  const good = { lifecycle:["online","idle","busy"], health:["healthy"], governance:["normal"] };
  const bad = ["unreachable","crashed","unhealthy","stalled","quarantined","policy-violation","failed","timed-out","auth-error","dependency-down"];
  if (bad.includes(value)) return "bad";
  if ((good[dim] || []).includes(value)) return "ok";
  if (["completed","has-floor"].includes(value)) return "ok";
  if (["offline","left","not-joined"].includes(value)) return "muted";
  return dim === "task" || dim === "floor" ? "info" : "warn";
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill = (dim, v) => `<span class="pill ${classFor(dim, v)}">${esc(v)}</span>`;

function render() {
  const rows = Object.values(agents).sort((a, b) => a.name.localeCompare(b.name)).map(a => {
    const tasks = Object.entries(a.tasks || {}).map(([id, s]) => pill("task", s) + `<span class="id">${esc(id)}</span>`).join("<br>") || '<span class="muted">none</span>';
    const floors = Object.entries(a.conversations || {}).map(([id, c]) => pill("floor", c.state) + `<span class="id">${esc(id)}${c.role ? " · " + esc(c.role) : ""}</span>`).join("<br>") || '<span class="muted">none</span>';
    const peer = a.peerHealth ? `<br><span class="id">peer: ${esc(a.peerHealth.state)}</span>` : "";
    const stale = a.stale ? ' <span class="id">(stale)</span>' : "";
    return `<tr>
      <td>${esc(a.name)}<br><span class="id">${esc(a.agentId)}</span></td>
      <td>${pill("lifecycle", a.lifecycle)}</td>
      <td>${pill("health", a.health)}${peer}</td>
      <td>${pill("governance", a.governance)}<br><span class="id">set by ${esc(a.governanceSetBy)}</span></td>
      <td>${tasks}${stale}</td>
      <td>${floors}</td>
      <td class="id">${esc(a.lastEventAgeSec ?? "")}${a.lastEventAgeSec !== undefined ? " s ago" : ""}</td>
    </tr>`;
  });
  document.getElementById("agents").innerHTML = rows.join("");
}

function describe(e) {
  const who = (agents[e.agentId] || {}).name || e.agentId;
  const src = e.source && e.source !== "self" ? ` <span class="id">set by ${esc(e.source)}</span>` : "";
  const reason = e.reason ? ` <span class="id">${esc(e.reason)}</span>` : "";
  if (e.type === "state_change") return `<b>${esc(who)}</b> ${esc(e.dimension)}${e.taskId ? " " + esc(e.taskId) : ""}: ${esc(e.from)} → ${esc(e.to)}${src}${reason}`;
  if (e.type === "floor_change") return `<b>${esc(who)}</b> floor ${esc(e.conversationId)}: ${esc(e.from)} → ${esc(e.to)}`;
  return `<b>${esc(who)}</b> ${esc(e.type)}${reason}`;
}

function log(e) {
  if (e.type === "heartbeat") return;
  const li = document.createElement("li");
  li.innerHTML = `<time>${esc((e.ts || "").slice(11, 19))}</time>${describe(e)}`;
  const ul = document.getElementById("log");
  ul.prepend(li);
  while (ul.children.length > 100) ul.lastChild.remove();
}

function askForToken(message) {
  if (waitingForToken) return;
  waitingForToken = true;
  if (controller) controller.abort();
  token = null;
  store.set(null);
  agents = {};
  render();
  el("log").replaceChildren();
  el("conn").textContent = message;
  el("forget").hidden = true;
  el("auth").hidden = false;
  el("tok").focus();
}

async function refresh() {
  if (waitingForToken) return;
  try {
    const res = await fetch("/v1/agents", { headers: authHeaders() });
    if (res.status === 401) return askForToken(token ? "token not accepted" : "token required");
    if (!res.ok) return;
    const fresh = {};
    for (const a of await res.json()) fresh[a.agentId] = a;
    agents = fresh;
    render();
  } catch (err) { /* server not reachable yet */ }
}

function handleBlock(block) {
  let id = null, data = "";
  for (const line of block.split("\n")) {
    if (line.startsWith("id:")) id = line.slice(3).trim();
    else if (line.startsWith("data:")) data += line.slice(5).trim();
  }
  if (!data) return;
  if (id) lastEventId = id;
  log(JSON.parse(data));
  refresh();
}

// The stream is read with fetch, not EventSource, because EventSource cannot send headers.
async function stream() {
  if (controller) controller.abort();
  const current = controller = new AbortController();
  // Replay the whole history on every connection: after a server restart the
  // event ids start again from 1, so an old cursor would hide the new events.
  lastEventId = "0";
  el("log").replaceChildren();
  try {
    const res = await fetch("/v1/stream", { headers: { ...authHeaders(), "Last-Event-ID": lastEventId }, signal: current.signal });
    if (res.status === 401) return askForToken(token ? "token not accepted" : "token required");
    if (!res.ok || !res.body) throw new Error("stream unavailable");
    el("conn").textContent = "live stream connected";
    el("forget").hidden = !token;
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let end;
      while ((end = buffer.indexOf("\n\n")) >= 0) {
        handleBlock(buffer.slice(0, end));
        buffer = buffer.slice(end + 2);
      }
    }
  } catch (err) { /* aborted, or the connection dropped */ }
  if (current.signal.aborted || waitingForToken) return;
  el("conn").textContent = "reconnecting…";
  setTimeout(() => { if (controller === current) stream(); }, 2000);
}

function start() {
  waitingForToken = false;
  lastEventId = "0";
  el("auth").hidden = true;
  el("conn").textContent = "connecting…";
  refresh();
  stream();
}

el("auth").addEventListener("submit", event => {
  event.preventDefault();
  token = el("tok").value.trim();
  el("tok").value = "";
  if (!token) return;
  store.set(token);
  start();
});
el("forget").addEventListener("click", () => askForToken("token required"));

start();
setInterval(refresh, 2000);
</script>
</body>
</html>
